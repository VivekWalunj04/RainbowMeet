# NexMeet reverse proxy — HTTPS mode.
# Selected automatically by docker/select-nginx-conf.sh when TLS certs exist
# in /etc/nginx/certs (mounted from ./certs on the host).
#
# For a real domain, replace the self-signed certs with Let's Encrypt:
#   docker run --rm -p 80:80 -v <project>/certs:/etc/letsencrypt \
#     certbot/certbot certonly --standalone -d meet.example.com
#   cp certs/live/meet.example.com/{fullchain,privkey}.pem <project>/certs/

upstream nexmeet_api {
    server backend:3000;
}

upstream nexmeet_livekit {
    server livekit:7880;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP → HTTPS (keeps /.well-known/acme-challenge on HTTP for certbot renewals)
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # REST API → backend
    location /api/ {
        proxy_pass http://NexMeet_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Socket.IO (chat / presence) — WebSocket upgrade required
    location /socket.io/ {
        proxy_pass http://NexMeet_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # LiveKit SFU signaling — WebSocket upgrade required
    location /livekit/ {
        rewrite ^/livekit/(.*)$ /$1 break;
        proxy_pass http://NexMeet_livekit;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
