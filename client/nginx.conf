# NexMeet reverse proxy — HTTP mode (no TLS certs present).
# At container start, docker/select-nginx-conf.sh swaps this file for
# nginx.ssl.conf when /etc/nginx/certs contains fullchain.pem + privkey.pem.

upstream nexmeet_api {
    server backend:3000;
}

upstream nexmeet_livekit {
    server livekit:7880;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # REST API → backend
    location /api/ {
        proxy_pass http://NexMeet_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO (chat / presence) — WebSocket upgrade required
    location /socket.io/ {
        proxy_pass http://NexMeet_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # LiveKit SFU signaling — WebSocket upgrade required
    location /livekit/ {
        rewrite ^/livekit/(.*)$ /$1 break;
        proxy_pass http://NexMeet_livekit;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
