# ══════════════════════════════════════════════════════════════
# NexMeet — AWS EC2 Backend Deployment
#
#   backend : Node.js Express REST API + Socket.IO (Port 3000)
#   caddy   : automatic Let's Encrypt TLS → https://$API_DOMAIN
#
# Connects to external managed cloud services:
#   - Neon PostgreSQL : DATABASE_URL (postgresql://...sslmode=require)
#   - Upstash Redis   : REDIS_URL    (rediss://...)
#
# Setup:
#   cp .env.example .env && nano .env
#   docker compose up -d --build
# ══════════════════════════════════════════════════════════════

services:
  backend:
    build:
      context: ../../server
      dockerfile: Dockerfile
    container_name: nexmeet-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CLIENT_URL=${CLIENT_URL}
      - JWT_SECRET=${JWT_SECRET}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - LIVEKIT_WS_URL=${LIVEKIT_WS_URL}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    container_name: nexmeet-caddy-backend
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - API_DOMAIN=${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  caddy_data:
  caddy_config:
