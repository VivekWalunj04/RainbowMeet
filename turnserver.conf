# ══════════════════════════════════════════════════════════════
# NexMeet coturn configuration
# The static-auth-secret must match TURN_SECRET in .env
# (also used by LiveKit clients for ephemeral TURN credentials).
# ══════════════════════════════════════════════════════════════

listening-port=3478
listening-ip=0.0.0.0
relay-ip=0.0.0.0

# REQUIRED on a public VM — set to this host's public IPv4:
# external-ip=203.0.113.10

fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=3a76fb1299f56175245046705385e2ac4d18a257f2739f45

realm=localhost

# TLS TURN (recommended in production): uncomment, mount certs at
# /etc/coturn/certs in docker-compose.yml, and open port 5349:
# tls-listening-port=5349
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem

min-port=49152
max-port=65535

log-file=stdout
verbose
